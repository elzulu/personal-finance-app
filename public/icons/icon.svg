<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo con esquinas redondeadas -->
  <rect width="512" height="512" rx="96" fill="#0f172a"/>
  <!-- Barras del gráfico (dentro del safe zone 102–410 px) -->
  <rect x="108" y="308" width="72" height="122" rx="12" fill="#22d3ee"/>
  <rect x="220" y="248" width="72" height="182" rx="12" fill="#34d399"/>
  <rect x="332" y="168" width="72" height="262" rx="12" fill="#22d3ee" opacity="0.85"/>
  <!-- Línea de tendencia ascendente -->
  <polyline
    points="144,288 256,228 368,148"
    stroke="#f0fdf4"
    stroke-width="14"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Punto en la cima -->
  <circle cx="368" cy="148" r="20" fill="#34d399"/>
  <!-- Punto de inicio -->
  <circle cx="144" cy="288" r="14" fill="#22d3ee"/>
</svg>
